name: ${COMPOSE_PROJECT_NAME:?Set COMPOSE_PROJECT_NAME in .env}

services:
  redis:
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE in .env}
    container_name: ${REDIS_CONTAINER_NAME:?Set REDIS_CONTAINER_NAME in .env}
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --loglevel
      - warning
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - omniroute

  omniroute:
    image: ${OMNIROUTE_IMAGE:?Set OMNIROUTE_IMAGE in .env}
    container_name: ${OMNIROUTE_CONTAINER_NAME:?Set OMNIROUTE_CONTAINER_NAME in .env}
    restart: unless-stopped
    init: true
    stop_grace_period: 40s
    mem_limit: 4g
    env_file:
      - .env
    environment:
      OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT: ${OMNIROUTE_CHAT_MAX_HEAVY_IN_FLIGHT:-4}
      DATA_DIR: ${DATA_DIR:?Set DATA_DIR in .env}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL in .env}
      PORT: ${DASHBOARD_PORT:?Set DASHBOARD_PORT in .env}
      DASHBOARD_PORT: ${DASHBOARD_PORT:?Set DASHBOARD_PORT in .env}
      API_PORT: ${API_PORT:?Set API_PORT in .env}
      API_HOST: ${API_HOST:?Set API_HOST in .env}
      OMNIROUTE_ENABLE_LIVE_WS: ${OMNIROUTE_ENABLE_LIVE_WS:?Set OMNIROUTE_ENABLE_LIVE_WS in .env}
      LIVE_WS_PORT: ${LIVE_WS_PORT:?Set LIVE_WS_PORT in .env}
      LIVE_WS_HOST: ${LIVE_WS_HOST:?Set LIVE_WS_HOST in .env}
      LIVE_WS_ALLOWED_ORIGINS: ${LIVE_WS_ALLOWED_ORIGINS:?Set LIVE_WS_ALLOWED_ORIGINS in .env}
      NEXT_PUBLIC_LIVE_WS_PUBLIC_URL: ${NEXT_PUBLIC_LIVE_WS_PUBLIC_URL:?Set NEXT_PUBLIC_LIVE_WS_PUBLIC_URL in .env}
      OMNIROUTE_MEMORY_MB: ${OMNIROUTE_MEMORY_MB:?Set OMNIROUTE_MEMORY_MB in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      API_KEY_SECRET: ${API_KEY_SECRET:?Set API_KEY_SECRET in .env}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set STORAGE_ENCRYPTION_KEY in .env}
      STORAGE_ENCRYPTION_KEY_VERSION: ${STORAGE_ENCRYPTION_KEY_VERSION:?Set STORAGE_ENCRYPTION_KEY_VERSION in .env}
      OMNIROUTE_WS_BRIDGE_SECRET: ${OMNIROUTE_WS_BRIDGE_SECRET:?Set OMNIROUTE_WS_BRIDGE_SECRET in .env}
      INITIAL_PASSWORD: ${INITIAL_PASSWORD:?Set INITIAL_PASSWORD in .env}
      DISABLE_SQLITE_AUTO_BACKUP: ${DISABLE_SQLITE_AUTO_BACKUP:?Set DISABLE_SQLITE_AUTO_BACKUP in .env}
    ports:
      - "${DASHBOARD_PORT}:${DASHBOARD_PORT}"
      - "${API_PORT}:${API_PORT}"
      - "${LIVE_WS_PORT}:${LIVE_WS_PORT}"
    volumes:
      - type: bind
        source: ${HOST_DATA_DIR:?Set HOST_DATA_DIR in .env}
        target: ${DATA_DIR:?Set DATA_DIR in .env}
        bind:
          create_host_path: false
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "healthcheck.mjs"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - omniroute
networks:
  omniroute:
    name: ${OMNIROUTE_NETWORK_NAME:?Set OMNIROUTE_NETWORK_NAME in .env}
volumes:
  redis-data:
    name: ${REDIS_VOLUME_NAME:?Set REDIS_VOLUME_NAME in .env}